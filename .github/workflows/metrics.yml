name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Jhonatafs
          template: classic
          base: ""
          config_timezone: America/Bahia

          # Configurações Globais
          repositories_forks: yes
          # Plugin de Linguagens
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_limit: 0
          plugin_languages_threshold: 0%
          plugin_languages_ignored: >-
            Jhonfs, dotfiles, Jhonatafs, Phoenix-Party, sicp-pt-br
          
          # Estética e Organização
          plugin_languages_details: percentage, lines
          plugin_languages_sections: most-used
          config_theme: dark
          repositories_skipped: Jhonfs, dotfiles, Jhonatafs, Phoenix-Party, sicp-pt-br
