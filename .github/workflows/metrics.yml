name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Jhonatafs
          template: classic
          base: ""
          config_timezone: America/Bahia
          
          # Configuração de Linguagens
          plugin_languages: yes
          plugin_languages_ignored: >-
            Jhonfs, dotfiles, Jhonatafs, Phoenix-Party, sicp-pt-br
          plugin_languages_limit: 8
          plugin_languages_recent_days: 14
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          
          # Estética e Filtros
          config_theme: dark
          repositories_skipped: Jhonfs, dotfiles, Jhonatafs, Phoenix-Party, sicp-pt-br
